# XAM-XAM LAB — déploiement GRATUIT : Render (service web, offre Free) + Neon (PostgreSQL, offre Free).
# Aucune base n'est créée sur Render (la base gratuite de Render expire après 30 jours) : DATABASE_URL = adresse Neon.
#   - plan: free OBLIGATOIRE (vérifier avant toute création ; ne jamais choisir un autre plan sans accord écrit) ;
#   - secrets : SESSION_SECRET et XX_ENCRYPTION_KEY générés par Render ; DATABASE_URL et XX_ADMIN_EMAILS saisis
#     dans les champs sécurisés de Render (sync: false), jamais dans le dépôt.
# Limites de l'offre gratuite : veille après 15 min sans visite (réveil ≈ 1 min), 512 Mo de mémoire, heures partagées
# avec les autres services gratuits du workspace ; pas de MQTT (HTTP seulement), pas de disque persistant.
services:
  - type: web
    name: xamxam-lab
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3100"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: XX_ADMIN_EMAILS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: XX_ENCRYPTION_KEY
        generateValue: true
