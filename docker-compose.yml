# XAM-XAM LAB — déploiement : PostgreSQL 16, plateforme web, passerelle MQTT.
# Utilisation : cp .env.example .env (renseigner SESSION_SECRET, XX_ADMIN_EMAILS, POSTGRES_PASSWORD…) ; docker compose up -d --build
# Registre d'images : IMAGE_REGISTRY (par défaut docker.io/library ; ex. mirror.gcr.io/library).
# HTTPS : placer un mandataire (Caddy, Nginx) devant le port 3100 ; MQTT : activer TLS (MQTTS_PORT, certificat) en production.
services:
  db:
    image: ${IMAGE_REGISTRY:-docker.io/library}/postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: xamxam
      POSTGRES_USER: xamxam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U xamxam -d xamxam"], interval: 5s, timeout: 5s, retries: 20 }
  app:
    build: { context: ., args: { BASE_REGISTRY: "${IMAGE_REGISTRY:-docker.io/library}" }, secrets: [extra_ca] }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://xamxam:${POSTGRES_PASSWORD}@db:5432/xamxam
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET requis}
      XX_ENCRYPTION_KEY: ${XX_ENCRYPTION_KEY:-}
      XX_ADMIN_EMAILS: ${XX_ADMIN_EMAILS:?XX_ADMIN_EMAILS requis}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      METEOMATICS_USERNAME: ${METEOMATICS_USERNAME:-}
      METEOMATICS_PASSWORD: ${METEOMATICS_PASSWORD:-}
      XX_STUN_URLS: ${XX_STUN_URLS:-}
      XX_TURN_URLS: ${XX_TURN_URLS:-}
      XX_TURN_USERNAME: ${XX_TURN_USERNAME:-}
      XX_TURN_CREDENTIAL: ${XX_TURN_CREDENTIAL:-}
      INSECURE_COOKIES: ${INSECURE_COOKIES:-false}
    ports: ["${APP_PORT:-3100}:3100"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 30 }
  mqtt:
    build: { context: ., args: { BASE_REGISTRY: "${IMAGE_REGISTRY:-docker.io/library}" }, secrets: [extra_ca] }
    restart: unless-stopped
    command: ["node", "services/mqtt-gateway.mjs"]
    depends_on: { app: { condition: service_healthy } }
    environment:
      XX_PLATFORM_URL: http://app:3100
      MQTT_PORT: 1883
      MQTT_ALLOW_INSECURE: ${MQTT_ALLOW_INSECURE:-false}
      MQTTS_PORT: ${MQTTS_PORT:-}
      MQTT_TLS_CERT: ${MQTT_TLS_CERT:-}
      MQTT_TLS_KEY: ${MQTT_TLS_KEY:-}
    ports: ["${MQTT_PUBLIC_PORT:-1883}:1883"]
volumes:
  db-data:
secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-/dev/null}   # autorité de certification d'un proxy d'entreprise (facultatif)
