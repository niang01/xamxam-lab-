; Nœud XAM-XAM LAB (ESP32 / Seeed XIAO ESP32-S3) — mesures HTTPS + commandes avec sécurités locales.
; Configuration locale : include/xx_config.h (copier xx_config.example.h ; non versionné).
[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.2.0

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.2.0
